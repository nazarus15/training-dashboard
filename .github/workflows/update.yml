name: Оновлення даних

on:
  schedule:
    # Цілі за Києвом: 23:00, 10:00 і повтор о 12:00, якщо ранкові дані не надійшли.
    # GitHub запускає заплановані задачі із затримкою і часом пропускає їх, тому тригерів багато:
    # кожні 15 хв у вечірньому (20–23 UTC) і ранковому (7–10 UTC) вікнах — це покриває і літній, і зимовий час.
    # Що запускати насправді, вирішує scripts/gate.py (один збір на слот); зайві запуски тривають секунди.
    - cron: "*/15 20-23 * * *"
    - cron: "*/15 7-10 * * *"
    - cron: "17 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Перевірка, чи потрібне оновлення
        id: gate
        run: python3 scripts/gate.py >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Встановити залежності
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Зібрати дані
        if: steps.gate.outputs.run == 'true'
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          SLOT: ${{ steps.gate.outputs.slot }}
          GCAL_URL: ${{ secrets.GCAL_URL }}
          GCAL_SECRET: ${{ secrets.GCAL_SECRET }}
        run: python scripts/fetch.py

      - name: Календар для Google Calendar (data/calendar.ics)
        if: always() && steps.gate.outputs.run == 'true'
        run: python scripts/ics.py

      - name: Закомітити зміни
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          git config user.name "training-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Змін немає"
          else
            git commit -m "Дані за $(TZ=Europe/Kyiv date +%F)"
            git pull --rebase --autostash origin main
            git push
          fi
