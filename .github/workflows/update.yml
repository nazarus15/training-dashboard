name: Оновлення даних

on:
  schedule:
    # Цілі за Києвом: 23:00, 10:00 і повтор о 12:00, якщо ранкові дані не надійшли.
    # GitHub запускає заплановані задачі із затримкою на години і часто пропускає їх (у листопаді 2026 приходило 2–3 запуски
    # на добу з ~35), тому головний тригер — зовнішній (Apps Script, див. README), а розклад тут лише запасний.
    # Тригерів багато:
    # кожні 15 хв у вечірньому (20–23 UTC) і ранковому (7–10 UTC) вікнах — це покриває і літній, і зимовий час.
    # Що запускати насправді, вирішує scripts/gate.py (один збір на слот); зайві запуски тривають секунди.
    - cron: "*/15 20-23 * * *"
    - cron: "*/15 7-10 * * *"
    - cron: "17 1 * * *"
  # ручний запуск (сайт, кнопка «Оновити дані зараз») або автоматичний ззовні:
  # Apps Script о 23:05, 10:05 і 12:05 за Києвом і сам сайт, якщо оновлення запізнюється, запускають з auto=true —
  # тоді gate.py застосовує ті самі правила слотів, що й для розкладу (зайвий запуск триває секунди).
  workflow_dispatch:
    inputs:
      auto:
        description: "Автоматичний запуск: перевірити слот (true) чи оновити негайно (false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Перевірка, чи потрібне оновлення
        id: gate
        run: python3 scripts/gate.py >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          AUTO: ${{ github.event.inputs.auto }}

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Встановити залежності
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Зібрати дані
        if: steps.gate.outputs.run == 'true'
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          SLOT: ${{ steps.gate.outputs.slot }}
          GCAL_URL: https://script.google.com/macros/s/AKfycbz7sidAahcGzuyJ-vcuExzQ29349CX3tzsGy3QjBSRYC6Z8VF2IHOWTAoLpNLFlK-S6DA/exec  # адреса веб-застосунку Apps Script (не секрет; захист — GCAL_SECRET)
          GCAL_SECRET: ${{ secrets.GCAL_SECRET }}
        run: python scripts/fetch.py

      - name: Календар для Google Calendar (data/calendar.ics)
        if: always() && steps.gate.outputs.run == 'true'
        run: python scripts/ics.py

      - name: Закомітити зміни
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          git config user.name "training-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Змін немає"
          else
            git commit -m "Дані за $(TZ=Europe/Kyiv date +%F)"
            git pull --rebase --autostash origin main
            git push
          fi
