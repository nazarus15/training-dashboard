<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Форма">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef1f4">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Силовий журнал · Форма Назара</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: телефон на лавці між підходами. Зверху стан збереження, далі вибране силове (вправи → підходи), нижче план двох тижнів. Кольори суперсетів — як кольори олімпійських млинців. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#15202b; --muted:#5b6876; --line:#d6dde5; --soft:#e3e8ee;
  --accent:#1f5fd1; --good:#1f8a4c; --warn:#c98a0b; --bad:#c4372f; --grey:#8a96a3;
  --plate-a:#c8322a; --plate-b:#1f5fd1; --plate-c:#d8a106; --plate-w:#2e8b57;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1419; --panel:#151d24; --ink:#e4ebf1; --muted:#93a2b0; --line:#26323d; --soft:#1d2730;
  --accent:#5b95f5; --good:#3fbf74; --warn:#e4ad2c; --bad:#ec5d53; --grey:#6f7c88;
  --plate-a:#ec5d53; --plate-b:#5b95f5; --plate-c:#e9c43a; --plate-w:#45b37a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1419; --panel:#151d24; --ink:#e4ebf1; --muted:#93a2b0; --line:#26323d; --soft:#1d2730;
  --accent:#5b95f5; --good:#3fbf74; --warn:#e4ad2c; --bad:#ec5d53; --grey:#6f7c88;
  --plate-a:#ec5d53; --plate-b:#5b95f5; --plate-c:#e9c43a; --plate-w:#45b37a; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:780px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:clamp(34px,6vw,48px);line-height:1;font-weight:700}
h2{font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:20px;font-weight:600}
a{color:var(--accent)}
.eyebrow{font-family:var(--f-data);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs a{font-family:var(--f-data);font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--panel)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
nav.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.notice{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-data);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.done{color:var(--good)} .pill.skip{color:var(--grey)} .pill.plan{color:var(--accent)} .pill.today{color:var(--warn)} .pill.off{color:var(--bad)}

/* sync */
.sync{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sync .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:13px}
.sync details{font-size:13px}
.sync summary{cursor:pointer;color:var(--accent)}
.sync ol{margin:8px 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.sync form{display:flex;gap:8px;flex-wrap:wrap}
.sync input{flex:1 1 220px;min-width:0;font:inherit;font-family:var(--f-data);font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}

/* session */
.session{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.s-head{padding:16px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.s-head .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.s-head p{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
.block{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.block:last-child{border-bottom:none}
.warm ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:2px}
.ex{display:flex;flex-direction:column;gap:8px;padding-left:12px;border-left:4px solid var(--c,var(--line))}
.ex-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ex-name{font-weight:600;font-size:16px}
.ex-name .tag{font-family:var(--f-data);font-size:12px;color:var(--c);margin-right:6px}
.ex-target{font-family:var(--f-data);font-size:13px;color:var(--muted);white-space:nowrap}
.ex-meta{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.ex-meta .prog{color:var(--good)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:28px minmax(0,1fr) 14px minmax(0,1fr) 44px;align-items:center;gap:6px}
.set .n{font-family:var(--f-data);font-size:12px;color:var(--muted);text-align:center}
.set .x{color:var(--muted);text-align:center;font-size:13px}
.field{position:relative}
.field input{width:100%;font:inherit;font-family:var(--f-data);font-size:16px;padding:8px 38px 8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.field span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.field input:focus-visible,.sync input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.check{width:44px;height:40px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--panel)}
.check:focus-visible,.btn:focus-visible,.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.set.is-done input{opacity:.75}
.foot{display:flex;flex-direction:column;gap:10px}
.foot label{font-size:13px;color:var(--muted)}
.foot textarea{width:100%;min-height:64px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical}
.rpe{display:flex;gap:4px;flex-wrap:wrap}
.rpe button{min-width:36px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:var(--f-data);cursor:pointer}
.rpe button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;font-size:14px;padding:9px 14px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--panel);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.saved{font-family:var(--f-data);font-size:11px;color:var(--muted)}

/* schedule */
.week{display:flex;flex-direction:column;gap:6px}
.week h3{font-size:16px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.days{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.day{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;font:inherit;color:inherit;background:transparent;border-left:0;border-right:0;border-top:0;width:100%}
.days .day:last-child{border-bottom:none}
button.day{cursor:pointer}
button.day:hover{background:var(--soft)}
.day.sel{background:var(--soft)}
.day .d{font-family:var(--f-data);font-size:11px;color:var(--muted);line-height:1.25}
.day .d b{display:block;font-size:15px;color:var(--ink)}
.day .t{display:flex;flex-direction:column;min-width:0}
.day .t strong{font-weight:600}
.day .t small{color:var(--muted);font-size:13px}
.kind{font-family:var(--f-data);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--k)}
.day.is-today .d b{color:var(--warn)}

/* старіші силові */
.older{border:1px dashed var(--line);border-radius:6px;padding:8px 12px;background:var(--panel)}
.older summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600}
.older[open]{display:flex;flex-direction:column;gap:12px}
.older .week h3{font-size:15px;color:var(--muted)}
/* history */
.hist{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.hist table{border-collapse:collapse;width:100%;font-size:13px}
.hist th,.hist td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.hist th{font-family:var(--f-data);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hist td.num{text-align:right}

/* rest timer */
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--panel);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:20}
.timer .num{font-size:24px;font-weight:600}
.timer button{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--panel);background:transparent;color:var(--panel);cursor:pointer}
.timer.over .num{color:var(--warn)}
.timer .go{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:.02em;color:var(--warn);animation:goGlow 1s ease-in-out infinite alternate}
@keyframes goGlow{from{opacity:.8;text-shadow:none}to{opacity:1;text-shadow:0 0 12px var(--warn)}}
/* суперсет: вправи зверху, раунди з однією галочкою на пару */
.ss{display:flex;flex-direction:column;gap:10px;padding-left:12px;border-left:4px solid var(--c,var(--line))}
.ss .ss-ex{padding-left:0;border-left:none}
.rounds{display:flex;flex-direction:column;gap:8px}
.round{display:grid;grid-template-columns:28px minmax(0,1fr) 44px;align-items:center;gap:6px;padding:6px 0;border-top:1px dashed var(--line)}
.round:first-child{border-top:none}
.round .n{font-family:var(--f-data);font-size:12px;color:var(--muted);text-align:center}
.round .rrows{display:flex;flex-direction:column;gap:6px}
.rset{display:grid;grid-template-columns:26px minmax(0,1fr) 14px minmax(0,1fr);align-items:center;gap:6px}
.rset .tag{font-family:var(--f-data);font-size:11px;color:var(--c)}
.rset .x{color:var(--muted);text-align:center;font-size:13px}
.round .check{height:auto;align-self:stretch;min-height:40px}
.round.is-done .rset .field input{opacity:.7}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Домашній зал · штанга, лавка, турнік, гирі</div>
      <h1>Силовий журнал</h1>
    </div>
    <nav class="tabs" aria-label="Розділи сайту"><a href="./">Огляд</a><a href="calendar.html">Календар</a><a href="planner.html">Планер</a><a href="strength.html" aria-current="page">Силовий журнал</a><a href="records.html">Рекорди</a><a href="settings.html">Налаштування</a></nav>
  </header>

  <div id="status" class="notice">Завантажую план і записи…</div>

  <section id="sessionWrap" hidden>
    <div class="session" id="session"></div>
  </section>

  <section id="scheduleWrap" hidden style="display:flex;flex-direction:column;gap:12px">
    <h2>Силові на 2 тижні</h2>
    <div id="schedule" style="display:flex;flex-direction:column;gap:16px"></div>
    <p class="muted" style="margin:0;font-size:13px">Силові з <a href="planner.html">Планера</a>. Тут записуєш підходи, а саме тренування засікай на Garmin як звичайно.</p>
  </section>

</div>

<div class="timer" id="timer" hidden role="timer" aria-live="off">
  <div><div class="eyebrow" style="color:inherit;opacity:.7">Відпочинок</div><span class="num" id="tLeft">0:00</span></div>
  <div style="display:flex;gap:8px"><button type="button" id="tPlus">+30 с</button><button type="button" id="tStop">Закрити</button></div>
</div>

<script src="workout.js?v=1793115014"></script>
<script src="strength.js?v=1793115014"></script>
